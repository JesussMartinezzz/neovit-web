<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#0A0A0A"/>
  
  <!-- Triángulo exterior -->
  <polygon points="250,100 370,310 130,310" fill="none" stroke="#FF6B00" stroke-width="12" stroke-linejoin="round"/>
  <!-- Triángulo interior sólido -->
  <polygon points="250,185 310,310 190,310" fill="#FF6B00"/>
  <!-- Línea base -->
  <line x1="130" y1="310" x2="370" y2="310" stroke="#FF6B00" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Texto NEOVIT -->
  <text x="250" y="400" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" letter-spacing="6" text-anchor="middle">
    <tspan fill="white">NEO</tspan><tspan fill="#FF6B00">VIT</tspan>
  </text>
  
  <!-- Subtítulo -->
  <text x="250" y="430" font-family="Arial, sans-serif" font-size="13" fill="#444" letter-spacing="5" text-anchor="middle">AGENCIA DIGITAL</text>
</svg>
